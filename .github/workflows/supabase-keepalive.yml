# Free-tier Supabase pauses after 7 days idle. The Railway push cron covered
# this incidentally until it silently stopped in Aug 2026; this is an
# independent daily ping. A cheap PostgREST read with the public anon key
# (RLS returns zero rows, but it's still a real query). A non-2xx fails the
# run, so GitHub emails on failure.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sfS --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1"
